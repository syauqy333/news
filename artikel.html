<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita | News Ponpes Madinah</title>
  <meta name="description" content="Berita Pondok Pesantren Madinah.">

  <!-- Favicon menggunakan logo -->
  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="news.css">

  <style>
    /* Pengaturan Logo & Pemotongan Sudut Putih */
    .merek {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-ponpes {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
    }

    /* Kenyamanan membaca artikel di layar HP / Mobile */
    .artikel {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
      font-size: 1.02rem;
      line-height: 1.75;
      overflow-wrap: break-word;
    }

    .artikel img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .artikel pre,
    .artikel table {
      max-width: 100%;
      overflow-x: auto;
      display: block;
    }

    .terkait {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px 24px;
    }

    @media (max-width: 640px) {
      .header .wadah {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .merek {
        font-size: 1.05rem;
        gap: 8px;
      }

      .logo-ponpes {
        width: 34px;
        height: 34px;
      }

      .menu {
        display: flex;
        gap: 14px;
        margin: 0;
        padding: 0;
        font-size: 0.9rem;
      }

      .artikel {
        padding: 16px 14px;
        font-size: 1rem;
        line-height: 1.7;
      }

      .artikel h1 {
        font-size: 1.45rem;
        line-height: 1.3;
      }

      .artikel h2 {
        font-size: 1.2rem;
        line-height: 1.35;
      }

      .terkait {
        padding: 0 14px 20px;
      }
    }
  </style>
</head>
<body data-halaman="detail">

  <header class="header">
    <div class="wadah">
      <a class="merek" href="index.html">
        <img src="logo.jpg" alt="Logo Pondok Pesantren Madinah" class="logo-ponpes">
        <span>News Ponpes Madinah</span>
      </a>
      <nav aria-label="Menu utama">
        <ul class="menu">
          <li><a href="index.html">Berita</a></li>
          <li><a class="luar" href="/" data-situs>Situs Ponpes</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <article id="artikel" class="artikel"></article>
    <section id="terkait" class="terkait"></section>
  </main>

  <footer class="footer">
    <div class="wadah">
      <strong>Pondok Pesantren Madinah</strong> &middot; Batang Hari, Muara Tembesi
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
